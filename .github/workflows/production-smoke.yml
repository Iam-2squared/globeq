name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify exact deployed Luna-only policy without generating content
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 15 "https://globeq.vercel.app/api/health/daily-content" -o /tmp/daily-policy.json; then
              if node -e "const p=require('/tmp/daily-policy.json');if(p.model!=='gpt-6-luna'||p.revision!=='luna-reviewed-20260929-v1'||p.automaticFallback!==false||p.automaticRetry!==false||p.maxToolCalls!==8||p.maxOutputTokens!==16000||p.deploymentCommit!==process.env.GITHUB_SHA)process.exit(1)"; then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = "1"
          cat /tmp/daily-policy.json

      - name: Wait for production
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://globeq.vercel.app"
          ok=0
          for i in $(seq 1 40); do
            code="$(curl -sS -o /tmp/home.html -w '%{http_code}' "$BASE/" || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          test "$ok" = "1"
          echo "production home HTTP 200"

      - name: Five production pages return 200
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://globeq.vercel.app"
          for path in / /news /quiz /ranking /account; do
            code="$(curl -sS -o /tmp/page.html -w '%{http_code}' "$BASE$path")"
            echo "$path -> $code ($(wc -c < /tmp/page.html) bytes)"
            test "$code" = "200"
          done

      - name: Public question contract
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://globeq.vercel.app/api/questions?date=2026-09-28" -o /tmp/questions.json
          node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync('/tmp/questions.json','utf8'));
          if(body.date!=='2026-09-28') throw new Error('wrong date');
          if(!Array.isArray(body.questions)||body.questions.length!==20) throw new Error('expected 20 questions, got '+body.questions?.length);
          for(const q of body.questions){
            if(!Array.isArray(q.options)||q.options.length!==4) throw new Error('expected four options');
          }
          const raw=JSON.stringify(body);
          for(const forbidden of ['is_correct','isCorrect','correctOption','correctOptionId','explanation','sourceUrl']){
            if(raw.includes(forbidden)) throw new Error('public payload leaked '+forbidden);
          }
          console.log(JSON.stringify({questions:body.questions.length,answerLeak:false}));
          NODE

      - name: Registration login logout smoke
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://globeq.vercel.app"
          USERNAME="smoke_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          PASSWORD="GlobeQ-smoke-${GITHUB_RUN_ID}!"
          echo "$USERNAME" > /tmp/smoke_username.txt

          code="$(curl -sS -c /tmp/cookies.txt -o /tmp/register.json -w '%{http_code}' \
            -X POST "$BASE/api/auth/register" \
            -H "Origin: $BASE" -H "Content-Type: application/json" \
            --data "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")"
          echo "register -> $code"
          test "$code" = "201"

          code="$(curl -sS -b /tmp/cookies.txt -o /tmp/account.html -w '%{http_code}' "$BASE/account")"
          echo "authenticated account -> $code"
          test "$code" = "200"
          grep -q "$USERNAME" /tmp/account.html

          code="$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /tmp/logout.json -w '%{http_code}' \
            -X POST "$BASE/api/auth/logout" -H "Origin: $BASE" -H "Content-Type: application/json" --data '{}')"
          echo "logout -> $code"
          test "$code" = "200"

          code="$(curl -sS -c /tmp/cookies.txt -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE/api/auth/login" -H "Origin: $BASE" -H "Content-Type: application/json" \
            --data "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")"
          echo "login -> $code"
          test "$code" = "200"

          code="$(curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /tmp/logout2.json -w '%{http_code}' \
            -X POST "$BASE/api/auth/logout" -H "Origin: $BASE" -H "Content-Type: application/json" --data '{}')"
          echo "final logout -> $code"
          test "$code" = "200"
